apiVersion: 1
datasources:
  - name: PharmaMonitoring
    uid: pg-monitoring
    type: postgres
    access: proxy
    url: postgres:5432
    user: $GRAFANA_DB_USER
    isDefault: true
    jsonData:
      database: $PG_DB
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 5
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    editable: false
