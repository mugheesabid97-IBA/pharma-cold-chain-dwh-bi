# Pharma Cold Chain DWH + BI - Phase 1 (SDI). Start: docker compose up -d --build
# Memory limits are sized for an 8 GB student laptop.

x-app-env: &app-env
  PROJECT_ROOT: /opt/project
  PYTHONPATH: /opt/project
  PG_HOST: postgres
  PG_PORT: "5432"
  PG_DB: ${POSTGRES_DB}
  PG_USER: ${POSTGRES_USER}
  PG_PASSWORD: ${POSTGRES_PASSWORD}
  INGEST_API_URL: http://ingest-api:8000
  AIRFLOW_API_URL: http://airflow:8080/api/v1
  AIRFLOW_API_USER: ${AIRFLOW_ADMIN_USER}
  AIRFLOW_API_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
  GEN_SALES_ROWS_PER_MONTH: ${GEN_SALES_ROWS_PER_MONTH:-14000}
  GEN_STREAM_ROWS: ${GEN_STREAM_ROWS:-3000}
  GEN_BAD_ROW_SHARE: ${GEN_BAD_ROW_SHARE:-0.01}
  STREAM_ROWS_PER_SEC: ${STREAM_ROWS_PER_SEC:-25}
  TZ: UTC

x-app-image: &app-image
  image: pharma-sdi-airflow:2.10.4
  user: "${AIRFLOW_UID:-50000}:0"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sdi-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=16MB", "-c", "max_connections=60"]
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/postgres/00_init_databases.sh:/docker-entrypoint-initdb.d/00_init_databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped

  airflow:
    <<: *app-image
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: sdi-airflow
    entrypoint: ["bash", "/opt/project/docker/airflow-start.sh"]
    environment:
      <<: *app-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "3"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__WEBSERVER__WORKERS: "2"
      AIRFLOW__WEBSERVER__WORKER_REFRESH_INTERVAL: "6000"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "30"
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      SDI_PIPELINE_SCHEDULE: ${SDI_PIPELINE_SCHEDULE:-}
    ports:
      - "8080:8080"
    volumes:
      - .:/opt/project
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,sys,urllib.request as u; h=json.load(u.urlopen('http://localhost:8080/health', timeout=10)); sys.exit(0 if h['metadatabase']['status']=='healthy' and h['scheduler']['status']=='healthy' else 1)"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s
    mem_limit: 2560m
    restart: unless-stopped

  ingest-api:
    <<: *app-image
    container_name: sdi-ingest-api
    entrypoint: ["python", "-m", "uvicorn", "src.ingestion.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-env
    ports:
      - "8000:8000"
    volumes:
      - .:/opt/project
    depends_on:
      postgres:
        condition: service_healthy
      airflow:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 1g
    restart: unless-stopped

  file-watcher:
    <<: *app-image
    container_name: sdi-file-watcher
    entrypoint: ["python", "-m", "src.ingestion.watcher"]
    environment: *app-env
    volumes:
      - .:/opt/project
    depends_on:
      airflow:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/watcher_heartbeat') < 60 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 256m
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: sdi-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/01_batch_ingestion.json
      PG_DB: ${POSTGRES_DB}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

volumes:
  pgdata:
  grafanadata:
